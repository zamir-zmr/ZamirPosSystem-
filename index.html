<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Name Tag Print - 80mm</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    padding:10px;
  }
  .btn-bar { text-align:center; margin-bottom:15px; }
  .btn-bar button {
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:6px;
    margin:0 5px;
  }
  .tag {
    width: 80mm;
    min-height: 50mm;
    border: 1px dashed #333;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#fff;
    padding:5mm;
    margin:0 auto;
  }
  .tag div {
    outline: none;
    width:100%;
  }
  .tag div:hover, .tag div:focus {
    background:#fffbcc;
  }
  .tag .logo { font-size:14px; font-weight:bold; color:#555; margin-bottom:8px; }
  .tag .name { font-size:26px; font-weight:bold; color:#000; }
  .tag .sub { font-size:14px; color:#777; margin-top:6px; }

  @media print {
    @page { size: 80mm auto; margin: 0; }
    .btn-bar { display:none; }
    body { background:#fff; padding:0; }
    .tag { border:none; width:80mm; margin:0; }
    .tag div:hover, .tag div:focus { background:transparent; }
  }
</style>
</head>
<body>

<div class="btn-bar">
  <button onclick="window.print()">Print</button>
</div>

<div class="tag">
  <div class="logo" contenteditable="true">ASB - ASH BAKES</div>
  <div class="name" contenteditable="true">Employee Name</div>
  <div class="sub" contenteditable="true">Designation</div>
</div>

</body>
</html>
