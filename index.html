<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Label Print - 80mm</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:#e5e5e5;
    padding:20px;
  }
  .btn-bar { text-align:center; margin-bottom:20px; }
  .btn-bar button {
    padding:10px 22px;
    font-size:15px;
    cursor:pointer;
    background:#111827;
    color:#fff;
    border:none;
    border-radius:6px;
    margin:0 5px;
    letter-spacing:0.5px;
  }
  .btn-bar button:hover { background:#000; }

  .tag {
    width: 80mm;
    min-height: 22mm;
    background:#fff;
    margin:0 auto;
    padding:1.5mm 3mm;
    position:relative;
    border: 1.2px solid #000;
  }
  .tag::before {
    content:"";
    position:absolute;
    top:1mm; left:1mm; right:1mm; bottom:1mm;
    border: 0.5px solid #000;
    pointer-events:none;
  }
  .inner {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    text-align:center;
    padding: 1.5mm 2mm;
  }
  .inner div {
    outline:none;
    width:100%;
  }
  .inner div:hover, .inner div:focus { background:#fff8dc; }

  .brand {
    font-size:8px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#555;
    margin-bottom:1mm;
    padding-bottom:1mm;
    border-bottom:0.5px solid #ccc;
  }
  .label {
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#666;
    margin-bottom:0.5mm;
  }
  .main-text {
    font-size:25px;
    font-weight:700;
    color:#000;
    letter-spacing:0.3px;
  }

  @media print {
    @page { size: 80mm auto; margin: 0; }
    .btn-bar { display:none; }
    body { background:#fff; padding:0; }
    .tag { margin:0; }
    .inner div:hover, .inner div:focus { background:transparent; }
  }
</style>
</head>
<body>

<div class="btn-bar">
  <button onclick="window.print()">Print</button>
</div>

<div class="tag">
  <div class="inner">
    <div class="brand" contenteditable="true">ASH BAKES</div>
    <div class="label" contenteditable="true">For</div>
    <div class="main-text" contenteditable="true">Al Khuwair</div>
  </div>
</div>

</body>
</html>
